originalRcptHeader = "X-Zone-Original-Rcpt"

[redis]
port = 6379
host = "127.0.0.1"
db = 3

[mongo]
url = "mongodb://127.0.0.1:27017/wildduck"
sender = "zone-mta"

[sender]
enabled = true
zone = "default"
gfs = "mail"
collection = "zone-queue"
# Share with WildDuck to enable forwarding loop detection.
# loopSecret = "secret value"

[srs]
secret = "secret value"

[attachments]
# Preferred backend for new attachments. Existing attachments retain their backend.
type = "gridstore"
bucket = "attachments"
decodeBase64 = true

# Required for S3 storage, including reading existing S3 attachments when using gridstore.
# Match WildDuck's attachments.s3 settings; keep the prefix stable and unique.
# Without explicit credentials, the AWS SDK default credential chain is used.
# [attachments.s3]
# bucket = "wildduck-attachments"
# prefix = "production"
# region = "us-east-1"
# endpoint = "https://s3.example.com"
# forcePathStyle = false
# accessKeyId = ""
# secretAccessKey = ""
# sessionToken = ""
# maxAttempts = 3
# connectionTimeout = 5000
# requestTimeout = 30000
# readTimeout = 30000
# slowReaderTimeout = 300000
# maxSockets = 50

# Match WildDuck's imap.aps settings and use the same messages database.
[aps]
enabled = false
sandbox = false
# topic = "com.apple.mobilemail.push.example.com"
# Certificate and private key in PEM format. Relative paths use Kirin's working directory.
# certPath = "config/apns.pem"
# keyPath = "config/apns.key"

[limits]
windowSize = 3600
rcptIp = 100
rcptWindowSize = 60
rcpt = 60

[gelf]
enabled = false
component = "mx"

[gelf.options]
graylogPort = 12201
graylogHostname = "127.0.0.1"
connection = "lan"

[rspamd]
forwardSkip = 10
blacklist = ["DMARC_POLICY_REJECT"]
softlist = ["RBL_ZONE"]

[rspamd.responses]
DMARC_POLICY_REJECT = "Unauthenticated email from {host} is not accepted due to domain's DMARC policy"
RBL_ZONE = "[{host}] was found from Zone RBL"

[auth]
minBitLength = 1024

[auth.dns]
maxLookups = 50
