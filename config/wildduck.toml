originalRcptHeader = "X-Zone-Original-Rcpt"

[redis]
port = 6379
host = "127.0.0.1"
db = 3

[mongo]
url = "mongodb://127.0.0.1:27017/wildduck"
sender = "zone-mta"

[sender]
enabled = true
zone = "default"
gfs = "mail"
collection = "zone-queue"

[srs]
secret = "secret value"

[attachments]
type = "gridstore"
bucket = "attachments"
decodeBase64 = true

[limits]
windowSize = 3600
rcptIp = 100
rcptWindowSize = 60
rcpt = 60

[gelf]
enabled = false
component = "mx"

[gelf.options]
graylogPort = 12201
graylogHostname = "127.0.0.1"
connection = "lan"

[rspamd]
forwardSkip = 10
blacklist = ["DMARC_POLICY_REJECT"]
softlist = ["RBL_ZONE"]

[rspamd.responses]
DMARC_POLICY_REJECT = "Unauthenticated email from {host} is not accepted due to domain's DMARC policy"
RBL_ZONE = "[{host}] was found from Zone RBL"

[auth]
minBitLength = 1024

[auth.dns]
maxLookups = 50
